services:
  hackstart26:
    build: .
    container_name: hackstart26
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hackstart26

volumes:
  caddy_data:
  caddy_config:
